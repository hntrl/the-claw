[project]
name = "claw-controller"
version = "0.1.0"
description = "Shared claw controller runtime state and transport bindings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9.0",
  "pyserial>=3.5",
]

[dependency-groups]
dev = [
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claw_controller"]
