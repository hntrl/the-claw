<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claw Voice Console</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <h1>Claw Voice Console</h1>
        <p>
          Talk to the claw. Agent tool-calls execute machine actions in real
          time.
        </p>
      </section>

      <section class="controls card">
        <div class="row">
          <button id="listenBtn" class="btn primary">Start Listening</button>
          <button id="forceRecordBtn" class="btn">Force Record</button>
          <button id="speakToggleBtn" class="btn">Voice Reply: On</button>
          <button id="clearBtn" class="btn">Clear Log</button>
        </div>
        <div class="row">
          <input
            id="manualInput"
            class="input"
            placeholder="Manual fallback: type command and press Enter"
          />
          <button id="sendBtn" class="btn">Send</button>
        </div>
        <p id="micStatus" class="status">Mic: idle</p>
        <p class="status hint">Push-to-talk: hold <kbd>F7</kbd>, release to send.</p>
      </section>

      <section class="card">
        <h2>Machine State</h2>
        <pre id="stateView">Loading...</pre>
        <div class="row">
          <button id="estopBtn" class="btn danger">Emergency Stop</button>
          <button id="resetBtn" class="btn warn">Reset Emergency</button>
          <button id="refreshStateBtn" class="btn">Refresh State</button>
        </div>
      </section>

      <section class="card">
        <h2>Session Log</h2>
        <div id="log" class="log"></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
