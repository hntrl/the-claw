[project]
name = "interrupt-claw-agent"
version = "0.1.0"
description = "Pipecat-powered agent backend for the Interrupt claw display demo"
requires-python = ">=3.11"
dependencies = [
  "cartesia[websockets]>=3.0.0",
  "langchain>=1.0.0",
  "langchain-openai>=1.0.0",
  "numpy>=2.0.0",
  "openai>=2.0.0",
  "pipecat-ai>=1.0.0",
  "pydantic>=2.9.0",
  "pyserial>=3.5",
  "python-dotenv>=1.0.1",
  "sounddevice>=0.5.0",
  "websockets>=12.0,<16.0",
]

[dependency-groups]
dev = [
  "ruff>=0.12.0,<1",
]
